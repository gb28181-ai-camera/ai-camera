name: ai_camera_app
description: "AI Camera 智能监控平台 - 移动端"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.0
  dio: ^5.7.0
  shared_preferences: ^2.3.0
  intl: ^0.19.0
  flutter_dva: ^1.0.9
  flutter_webrtc: ^1.6.2+hotfix.4
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # ── IOT 设备接入（v0.3.0）──────────────────────────────────
  # 下列四项是「添加设备 + MQTT 信令」的最小依赖集合：
  # - mqtt_client：WebRTC 信令通道（后端不提供 App 侧 SDP 转发 HTTP 端点时使用）；
  # - flutter_blue_plus：蓝牙配网（Nordic UART Service）；
  # - mobile_scanner：扫描设备分享二维码；
  # - permission_handler：蓝牙/相机权限申请与「去设置」引导。
  mqtt_client: ^10.13.0
  # 固定在 1.x：2.x 起改为 FlutterBluePlus 商业许可（connect() 需声明 License），
  # 1.36.8 仍是 BSD 许可且 API 稳定，满足本项目蓝牙配网需求。
  flutter_blue_plus: ^1.36.8
  mobile_scanner: ^7.4.2
  # 固定在 12.x：13.x 的 Android 模块要求 compileSdk 37，而当前 Flutter/AGP
  # 组合为 36（AGP 9 的最高推荐值）。12.x 功能足够且可正常构建。
  permission_handler: ^12.0.3
  # ── 语音聊天（v0.6.0）──────────────────────────────────────
  # record：麦克风流式采集 PCM16（BSD-3-Clause）；
  # flutter_sound：PCM16 边收边播（MPL-2.0）；
  # web_socket_channel：语音 WS 传输（BSD-3-Clause）。
  record: ^7.1.2
  flutter_sound: ^9.30.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
