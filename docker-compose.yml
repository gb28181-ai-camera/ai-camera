# ============================================================================
# AI Camera 智能监控平台 —— Docker Compose 部署（开源版）
#
# ┌── 两种用法 ────────────────────────────────────────────────────────────┐
# │ 1) 本地开发：只起基础设施，应用在宿主机跑（热重载、可断点调试）        │
# │      cp .env.example .env && docker compose up -d                     │
# │      → 启动 postgres（含 PostGIS + pgvector）与 redis                  │
# │      → 随后在宿主机： cd backend && go run ./cmd/server/main.go        │
# │                                                                       │
# │ 2) 完整部署：应用也进容器                                             │
# │      docker compose --profile full up -d --build                      │
# │      → 额外启动 backend / frontend / zlm                              │
# └───────────────────────────────────────────────────────────────────────┘
#
# 说明：未标注 profiles 的服务（postgres / redis）**始终启动**，
#       因此不加 --profile 时即为「本地开发只起基础设施」的形态。
#
# 端口占用：
#   5432  PostgreSQL        6379  Redis
#   8080  前端入口(nginx)   8081  后端 API（仅 profile full）
#   5060  SIP(UDP/TCP，v0.2.0)     30000-30500/udp  RTP(v0.2.0)
#
# GB28181（profile: gb28181）：只额外起 ZLM。SIP 信令（sipsvc）**内嵌在 backend
# 进程内**（GB28181_EMBEDDED=true），因为 HTTP 触发的播放/云台/回放要用进程内的
# SIP 会话状态；分进程形态见 sipsvc 服务的注释。
# ZLM 用单端口收流（只发布 10000），因此**不需要** 30000-30500 端口段。
# 设计与实测见 docs/敏捷开发/v0.2.0 设备接入与国标视频/00-设计与工作量评估.md §2.2
# ============================================================================

name: ai-camera

services:
  # ══════════════════════════════════════════════════════════════════
  # 基础设施（始终启动）
  # ══════════════════════════════════════════════════════════════════

  postgres:
    build:
      context: ./deploy/postgres
    image: ai-camera-postgres:16
    container_name: ai-camera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aicamera}
      # 不提供兜底默认值：明文弱密码入库是明确禁止的（见 .env.example）
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD，参考 .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-ai_camera_dev}
      # 中文环境排序，与后端 DSN 的 TimeZone=Asia/Shanghai 一致
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aicamera} -d ${POSTGRES_DB:-ai_camera_dev}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks: [ai-camera]

  redis:
    image: redis:7-alpine
    container_name: ai-camera-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-aicamera_redis}
      --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aicamera_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [ai-camera]

  # ══════════════════════════════════════════════════════════════════
  # 应用服务（profile: full）
  # ══════════════════════════════════════════════════════════════════

  backend:
    profiles: [full]
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ai-camera-backend:latest
    container_name: ai-camera-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      CONFIG_PATH: config/config.yaml
      # config.compose.yaml 只提供基线（主机名为 compose 服务名），
      # 密钥与随环境变化的值一律由这里注入 ——
      # 见 backend/config/config.go 的 envBindings。
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${POSTGRES_USER:-aicamera}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      DATABASE_DBNAME: ${POSTGRES_DB:-ai_camera_dev}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-aicamera_redis}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET，参考 .env.example}
      # ── GB28181 信令（默认内嵌在 backend 进程内）──
      # ★ 为什么默认内嵌：HTTP 接口触发的播放/云台/回放要靠 control.Default()
      #   调用 SIP 会话状态，而那是**进程内**对象。分容器部署时 API 进程里
      #   没有 SIP 服务，这些接口会稳定返回 503。跨进程命令通道（Redis RPC）
      #   尚未实现，因此一期默认内嵌 —— 单节点形态下这也是最简单正确的部署。
      GB28181_ENABLED: ${GB28181_ENABLED:-true}
      GB28181_EMBEDDED: ${GB28181_EMBEDDED:-true}
      GB28181_SIP_LISTEN_IP: 0.0.0.0
      GB28181_SIP_PORT: "5060"
      GB28181_SIP_ADVERTISE_IP: ${SIP_ADVERTISE_IP:-127.0.0.1}
      GB28181_SIP_DOMAIN: ${SIP_DOMAIN:-3402000000}
      GB28181_SIP_SERVER_ID: ${SIP_PLATFORM_ID:-34020000002000000001}
      GB28181_SIP_NONCE_SECRET: ${SIP_NONCE_SECRET:-}
      GB28181_MEDIA_PUBLIC_IP: ${SIP_ADVERTISE_IP:-127.0.0.1}
      GB28181_MEDIA_RTP_PROXY_PORT: "${ZLM_RTP_PORT:-10000}"
    ports:
      - "${BACKEND_PORT:-8081}:8080"
      # SIP 端口随 backend 一起暴露（内嵌模式）。若改用独立 sipsvc，
      # 必须把这两行移到 sipsvc 服务并设置 GB28181_EMBEDDED=false。
      - "${SIP_PORT:-5060}:5060/udp"
      - "${SIP_PORT:-5060}:5060/tcp"
    volumes:
      - ./backend/config/config.compose.yaml:/app/config/config.yaml:ro
      - uploads:/app/uploads
    networks: [ai-camera]

  frontend:
    profiles: [full]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ai-camera-frontend:latest
    container_name: ai-camera-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    # 用 compose 专用 nginx 配置覆盖镜像内置的：额外把 /web、/app、/uploads
    # 反代到 backend 服务。镜像内置配置不带反代，单独使用时不受影响。
    volumes:
      - ./frontend/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [ai-camera]

  # ══════════════════════════════════════════════════════════════════
  # 媒体服务（profile: gb28181）
  # ══════════════════════════════════════════════════════════════════

  zlm:
    profiles: [gb28181]
    image: zlmediakit/zlmediakit:master
    container_name: ai-camera-zlm
    restart: unless-stopped
    ports:
      - "${ZLM_HTTP_PORT:-8082}:80"          # HTTP-FLV / HLS / WHEP / REST API
      - "${ZLM_RTP_PORT:-10000}:10000/udp"   # ★ 单端口模式：收流只用一个 UDP 端口
      - "${ZLM_RTP_PORT:-10000}:10000/tcp"   #   设备用 TCP-PASSIVE 时走这条
      - "8000:8000/udp"                      # WebRTC 收流端口
    # ZLM 不做环境变量替换（实测 `${VAR}` 会原样保留），而 secret 与 hook 地址
    # 必须随环境变化。故用一层入口脚本把模板渲染到容器可写层再启动。
    # 见 deploy/zlm/render-config.sh 的说明。
    entrypoint: ["/bin/sh", "/opt/media/render-config.sh"]
    volumes:
      # 只读挂载模板：渲染结果写到容器内的 /opt/media/conf/config.ini，
      # **不写回**宿主机文件，避免把某次部署的密钥固化进仓库。
      - ./deploy/zlm/config.ini:/opt/media/conf/config.tmpl:ro
      - ./deploy/zlm/render-config.sh:/opt/media/render-config.sh:ro
      - zlmrecord:/opt/media/bin/www/record
    environment:
      TZ: Asia/Shanghai
      # 与 ac_gb_media_server.secret / ZLM 的 [api] secret 三处必须一致
      ZLM_SECRET: ${ZLM_SECRET:?请在 .env 中设置 ZLM_SECRET，参考 .env.example}
      # 平台回调基址。两种形态：
      #   compose full：backend 发布在宿主机 8081 → 默认值即可（经 host-gateway 回连宿主机）
      #   本地开发    ：backend 直接在宿主机 8080 跑 → 设 ZLM_HOOK_BASE=http://host.docker.internal:8080
      ZLM_HOOK_BASE: ${ZLM_HOOK_BASE:-http://host.docker.internal:8081}
    # Linux 宿主上 host.docker.internal 默认不存在，需显式映射到网关
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [ai-camera]

  # GB28181 信令服务 —— 与 backend 同属一个工程、同一个镜像（backend/Dockerfile
  # 产出两个入口）。一期固定 1 副本：TCP 连接与 SIP 事务/会话状态是节点本地的，
  # 且设备注册后绑定 server_id，跨节点命令路由一期不做。
  # ⚠️ 独立信令服务：**当前不推荐使用**。
  # HTTP 接口（播放/云台/回放）依赖进程内的 SIP 会话状态；分进程部署时
  # `control.Default()` 在 API 进程中为 nil，这些接口会稳定 503。
  # 跨进程命令通道（Redis RPC）尚未实现，因此本服务只在做协议层压测/
  # 独立调试时启用（profile: sipsvc-standalone），生产请用 backend 内嵌模式。
  sipsvc:
    profiles: [sipsvc-standalone]
    image: ai-camera-backend:latest   # 复用 backend 的镜像，不单独构建
    command: ["/app/ai-camera-sipsvc"]
    container_name: ai-camera-sipsvc
    restart: unless-stopped
    depends_on:
      # 只等基础设施：镜像由 backend 构建，但不必等它启动
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    # 若启用本服务，必须同时：① 把 backend 的 GB28181_EMBEDDED 设为 false；
    # ② 把下面两行端口从 backend 服务移到这里（否则 5060 冲突）。
    # ports:
    #   - "${SIP_PORT:-5060}:5060/udp"
    #   - "${SIP_PORT:-5060}:5060/tcp"
    environment:
      TZ: Asia/Shanghai
      CONFIG_PATH: config/config.yaml
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${POSTGRES_USER:-aicamera}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      DATABASE_DBNAME: ${POSTGRES_DB:-ai_camera_dev}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-aicamera_redis}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET，参考 .env.example}
      GB28181_ENABLED: "true"
      GB28181_SIP_LISTEN_IP: 0.0.0.0
      GB28181_SIP_PORT: "5060"
      GB28181_SIP_ADVERTISE_IP: ${SIP_ADVERTISE_IP:-127.0.0.1}
      GB28181_SIP_DOMAIN: ${SIP_DOMAIN:-3402000000}
      GB28181_SIP_SERVER_ID: ${SIP_PLATFORM_ID:-34020000002000000001}
      GB28181_SIP_NONCE_SECRET: ${SIP_NONCE_SECRET:-}
      # ★ SDP 里通告给设备的收流地址，必须是设备可达的宿主机地址
      GB28181_MEDIA_PUBLIC_IP: ${SIP_ADVERTISE_IP:-127.0.0.1}
      GB28181_MEDIA_RTP_PROXY_PORT: "${ZLM_RTP_PORT:-10000}"
    volumes:
      - ./backend/config/config.compose.yaml:/app/config/config.yaml:ro
    networks: [ai-camera]

  # 说明：SIP 与 HTTP API 分成两个服务，只因扩缩容诉求相反 ——
  #   backend 可多副本，sipsvc 必须单副本（设备注册后绑定到具体节点）。
  #   若不需要水平扩展 backend，可改为内嵌模式：设置 GB28181_EMBEDDED=true
  #   并只跑 backend 一个服务，此时 SIP 监听随 API 进程一起启动。
  # ══════════════════════════════════════════════════════════════════
  # 语音 Agent（profile: voice）
  # ══════════════════════════════════════════════════════════════════
  #
  # Pipecat 控制面只做配置/会话/pipeline 装配，**音频桥接尚未接通**
  # （/health 返回 audio_bridge=not_connected），详见 deploy/pipecat/README.md。
  # 仅内网暴露：后台「Pipecat 控制面地址」填 http://pipecat:8090。
  # 不映射宿主机端口。
  pipecat:
    profiles: [voice]
    build:
      context: ./deploy/pipecat
    container_name: ai-camera-pipecat
    restart: unless-stopped
    environment:
      # ⚠️ 这里**不能**用 `${PIPECAT_TOKEN:?}`：Compose 会对文件里所有服务做插值，
      # 即使该 profile 未启用。那样会导致「没配 Pipecat token 就连
      # `docker compose up -d` 起基础设施都失败」。
      # 真正的 fail-fast 在控制面内部：token 为空时进程拒绝启动（见 main.py）。
      PIPECAT_TOKEN: ${PIPECAT_TOKEN:-}
      TZ: Asia/Shanghai
    expose:
      - "8090"
    networks: [ai-camera]

volumes:
  pgdata:
  redisdata:
  uploads:
  zlmrecord:               # v0.2.0：云端录像落盘

networks:
  ai-camera:
    driver: bridge
