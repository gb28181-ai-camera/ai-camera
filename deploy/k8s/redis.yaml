# Redis（单实例）。
#
# 定位：当前业务尚未强依赖（验证码 / 令牌黑名单 / WebSocket 会话 / 分布式锁
# 都是预留场景）。生产若真正接入，应改为 Sentinel 或 Cluster，见
# docs/部署文档/02-监控与容灾.md §5.4。
#
# 单副本 + PVC：AOF 每秒刷盘，RPO ≤ 1s。Redis 不可用时后端必须降级而不是崩溃
# —— 这是接入时要在调用点保证的，不是本清单能解决的。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-camera-redis-data
  labels:
    app.kubernetes.io/name: ai-camera-redis
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-camera-redis
  labels:
    app.kubernetes.io/name: ai-camera-redis
spec:
  replicas: 1
  strategy:
    type: Recreate          # 单 PVC：先停旧 Pod 再起新 Pod，避免挂载冲突
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-camera-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-camera-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          # 不用 args 直接写密码：避免口令出现在 Pod spec / kubectl describe 里。
          command:
            - sh
            - -c
            - exec redis-server --requirepass "$REDIS_PASSWORD" --appendonly yes --appendfsync everysec
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-camera-secrets
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ai-camera-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: ai-camera-redis
  labels:
    app.kubernetes.io/name: ai-camera-redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ai-camera-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
