# ⚠️ 占位密钥模板 —— 仓库里**不得**出现真实密钥。
#
# 使用方式（二选一）：
#   1. 直接 apply 本文件后立刻替换：
#        kubectl -n ai-camera create secret generic ai-camera-secrets \
#          --from-literal=DATABASE_PASSWORD='...' \
#          --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#          --from-literal=GB28181_SIP_NONCE_SECRET="$(openssl rand -hex 32)" \
#          --from-literal=REDIS_PASSWORD="$(openssl rand -hex 16)" \
#          --from-literal=ZLM_SECRET="$(openssl rand -hex 24)" \
#          --from-literal=PIPECAT_TOKEN="$(openssl rand -hex 32)" \
#          --dry-run=client -o yaml | kubectl apply -f -
#   2. 用 SealedSecret / External Secrets / SOPS 管理，仓库只存密文。
#
# 约束：
#   - ZLM_SECRET 长度必须 ≥ 32 字符（ZLM 启动时会校验，过短会被改写）。
#   - JWT_SECRET 建议 ≥ 32 字符随机串。
#   - 这三处 ZLM secret 必须一致：本 Secret、ac_gb_media_server.secret、
#     ZLM 渲染后的 config.ini。
apiVersion: v1
kind: Secret
metadata:
  name: ai-camera-secrets
  labels:
    app.kubernetes.io/part-of: ai-camera
type: Opaque
stringData:
  DATABASE_PASSWORD: "CHANGE_ME"
  JWT_SECRET: "CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME"
  GB28181_SIP_NONCE_SECRET: "CHANGE_ME"
  REDIS_PASSWORD: "CHANGE_ME"
  # ≥32 字符；仅允许 A-Z a-z 0-9 . _ -
  ZLM_SECRET: "CHANGE_ME_ZLM_SECRET_AT_LEAST_32_CHARS"
  PIPECAT_TOKEN: "CHANGE_ME"
  # ── IOT 多协议接入（v0.3.0）──
  # TURN REST 凭据签名密钥：必须与 coturn 的 --static-auth-secret 完全一致。
  TURN_STATIC_AUTH_SECRET: "CHANGE_ME"
  # /rpc/turn/credentials 的调用令牌；为空时 RPC 返回 503（fail-closed）。
  TURN_RPC_TOKEN: "CHANGE_ME"
  # /rpc/mqtt/* 的调用令牌；broker 与后端必须一致。
  MQTT_RPC_TOKEN: "CHANGE_ME"
