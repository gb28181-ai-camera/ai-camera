; AI Camera —— ZLMediaKit 最小覆盖配置
;
; 只列本项目需要覆盖的项，其余由 ZLM 自身默认值兜底。
; 若实测发现缺失项导致启动异常，再从镜像默认配置补齐。
;
; 设计依据：docs/敏捷开发/v0.2.0 设备接入与国标视频/00-设计与工作量评估.md §2.2

[general]
; 节点标识，与 ac_gb_media_server.server_id 对应
mediaServerId=ai-camera-zlm-01
; 允许无 secret 访问的本地地址（便于容器内调试）
check_nvr=0

[api]
; ZLM HTTP API 密钥。容器化部署时由 compose 从 .env 注入（见 .env.example 的 ZLM_SECRET）
; ★ 长度必须 ≥32 字符，否则 ZLM 启动时会自动改写（实测：19 字符被拒）
secret=aicamera-zlm-dev-secret-0123456789
apiDebug=0

[http]
port=80

[rtp_proxy]
; ★ 单端口模式的核心：所有 RTP 流共用此端口，由 ZLM 按 SSRC 自动建流（设计 §2.2）
port=10000
; 保留端口段供多端口模式备用（本期不用）
port_range=30000-35000
; 收流超时
timeoutSec=15
