# ============================================================================
# AI Camera 后端配置模板 —— 本地开发（宿主机跑 Go 进程）
#
# 用法：
#   cp backend/config/config.example.yaml backend/config/config.yaml
#   然后按需修改（config.yaml 已被 gitignore，不会提交）
#
# 依赖本地数据库：
#   docker compose up -d            # 起 postgres（含 PostGIS + pgvector）与 redis
#   cd backend && go run ./cmd/server/main.go
#
# 所有标了「可被环境变量覆盖」的项，都可以不改文件、直接用环境变量覆盖，
# 例如：DATABASE_PASSWORD=xxx go run ./cmd/server/main.go
# 完整映射见 backend/config/config.go 的 envBindings。
# ============================================================================

server:
  port: 8080
  mode: debug
  read_timeout: 10s
  write_timeout: 10s

database:
  # 本地 compose 起的 PostgreSQL（宿主机视角为 localhost）
  host: localhost
  port: 5432
  user: aicamera
  # 【需填写】与 .env 的 POSTGRES_PASSWORD 一致；也可用环境变量 DATABASE_PASSWORD 覆盖
  password: ""
  dbname: ai_camera_dev
  sslmode: disable
  max_idle_conns: 5
  max_open_conns: 20
  conn_max_lifetime: 1h

redis:
  host: localhost
  port: 6379
  password: aicamera_redis
  db: 0
  pool_size: 10

jwt:
  # 【需修改】生产环境务必更换。生成：openssl rand -base64 48
  secret: "dev-only-please-change-me"
  expire_hours: 7200

casbin:
  model_path: config/rbac_model.conf
  auto_load_interval: 5m

media:
  upload_dir: ./uploads
  base_url: "http://localhost:8080/uploads"

thirdparty:
  getui:
    app_id: ""
    app_key: ""
    app_secret: ""
    master_secret: ""
  sms:
    secret_id: ""
    secret_key: ""
    sdk_app_id: ""
    sign_name: ""

swagger:
  enabled: true

# ── GB28181 信令服务（cmd/sipsvc）────────────────────────────────
# 开发期可用 gb28181.embedded=true 让 cmd/server 内嵌启动同一组 goroutine，
# 一条命令即可与 tools/gbsim 联调；生产建议独立进程（副本固定 1）。
gb28181:
  enabled: false
  embedded: false
  charset: GB2312
  sip:
    listen_ip: 0.0.0.0
    port: 5060
    transport: UDP            # UDP / TCP / BOTH
    advertise_ip: ""          # 设备可达的本机 IP；留空则用 listen_ip
    domain: 3402000000        # SIP 域（From/To 的 realm 部分）
    realm: 3402000000
    server_id: 34020000002000000001
    server_name: AI Camera
    register_expires: 3600
    # 【需修改】生产环境务必更换，用于无状态 Digest nonce 的 HMAC
    nonce_secret: "dev-only-change-me"
  media:
    public_ip: 127.0.0.1      # SDP c=/o= 中通告给设备的 IP（单端口模式下即 ZLM 地址）
    rtp_proxy_port: 10000     # ZLM 单端口模式的共享收流端口
    # GB28181-2022 编码协商。顺序即 SDP m= 行中的优先级；留空用内置默认值。
    # 2022 新增 H.265 / G.722.1 / AAC，但设备与浏览器是否支持取决于两端，
    # 平台只负责按能力通告，不做转码（转码在 ZLM）。
    video_codecs:
      - PS/90000
      - H264/90000
      - H265/90000
    audio_codecs:
      - PCMA/8000
      - MPEG4-GENERIC/44100
      - AAC/44100
  cascade:
    # 作为下级平台向上级注册。使用独立端口，避免与设备接入的 5060 混用。
    enabled: false
    listen_ip: 0.0.0.0
    port: 5061
    advertise_ip: ""          # 留空则用 listen_ip

log:
  level: info
  format: console
  output: console
  max_size: 100
  max_backups: 30
  max_age: 7
