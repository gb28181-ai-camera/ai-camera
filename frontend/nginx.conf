server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # 管理后台（base /admin/，产物位于 /usr/share/nginx/html/admin）
    # 注意：alias 路径片段会被替换为 location 前缀，故末尾均需带 `/`
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        # SPA 路由回退；回退 URI 重新匹配本 location，alias 解析为 .../admin/index.html
        try_files $uri $uri/ /admin/index.html;
    }

    # 管理后台带 hash 的静态资源强缓存
    location /admin/assets/ {
        alias /usr/share/nginx/html/admin/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 播放器第三方脚本与 WASM（h265web.js / jessibuca）
    # 显式声明 application/wasm：部分 nginx 的 mime.types 不含 wasm，
    # 类型错误会导致 WebAssembly.instantiateStreaming 被浏览器拒绝。
    location /admin/static/js/ {
        alias /usr/share/nginx/html/admin/static/js/;
        types {
            application/wasm wasm;
            application/javascript js;
            text/javascript mjs;
        }
        expires 7d;
        add_header Cache-Control "public";
    }

    # 官网介绍页（base /，产物位于站点根）
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 后端接口反向代理（如由本容器统一入口时启用，按需调整 upstream）
    # location /web/ { proxy_pass http://backend:8080; proxy_set_header Host $host; }
    # location /app/ { proxy_pass http://backend:8080; proxy_set_header Host $host; }
}
