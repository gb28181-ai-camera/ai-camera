# AI Camera 官网介绍页 nginx 配置
# 纯静态 SPA（单页锚点导航），无后端依赖
server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 关闭版本号暴露
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff2;

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
