# ============================================================================
# AI Camera 前端 nginx 配置 —— Docker Compose 编排专用
#
# 与镜像内置的 nginx.conf 的差异：额外把后端接口反代到 compose 的 backend 服务。
#
# 为什么不直接改镜像内置的 nginx.conf：内置配置若写死 `proxy_pass http://backend:8080`，
# 单独运行该镜像（无 compose 网络、无 backend 主机名）时 nginx 会因无法解析上游而启动失败。
# 故拆成两份，由 docker-compose.yml 覆盖挂载本文件。
#
# 由 docker-compose.yml 挂载到 /etc/nginx/conf.d/default.conf
# ============================================================================

server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 单请求体上限（与后端上传接口匹配）
    client_max_body_size 100m;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # ── 管理后台（base /admin/，产物位于 /usr/share/nginx/html/admin）──
    # 注意：alias 路径片段会被替换为 location 前缀，故末尾均需带 `/`
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        # SPA 路由回退；回退 URI 重新匹配本 location，alias 解析为 .../admin/index.html
        try_files $uri $uri/ /admin/index.html;
    }

    location /admin/assets/ {
        alias /usr/share/nginx/html/admin/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 播放器第三方脚本与 WASM（h265web.js / jessibuca）
    # 显式声明 application/wasm：部分 nginx 的 mime.types 不含 wasm，
    # 类型错误会导致 WebAssembly.instantiateStreaming 被浏览器拒绝。
    location /admin/static/js/ {
        alias /usr/share/nginx/html/admin/static/js/;
        types {
            application/wasm wasm;
            application/javascript js;
            text/javascript mjs;
        }
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── 官网介绍页（base /，产物位于站点根）──
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── 后端接口反向代理 ──
    location /web/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /app/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件静态访问
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Swagger 接口文档（config.compose.yaml 中 swagger.enabled 为 true 时可用）
    location /swagger/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # ── v0.2.0：ZLMediaKit 媒体流 ──
    # 前端播放 HTTP-FLV / HLS / WHEP 需反代到 zlm 服务。
    # 待 ZLMediaKit 接入后取消注释（见 docs/敏捷开发/v0.2.0 设备接入与国标视频/）。
    #
    # location /media/ {
    #     proxy_pass http://zlm:80/;
    #     proxy_set_header Host $host;
    #     # WHEP 需要透传 WebSocket 与 CORS
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade    $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    # }
}
